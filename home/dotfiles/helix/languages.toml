# Helix言語サーバー設定

# TOML
[[language]]
name = "toml"
language-servers = ["taplo"]

[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

# YAML
[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]

[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

# JSON
[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]

[language-server.vscode-json-language-server]
command = "vscode-json-language-server"
args = ["--stdio"]

# Markdown
[[language]]
name = "markdown"
language-servers = ["marksman", "mpls"]

# marksman は nixpkgs(darwin) の ICU 不整合で通常起動すると SIGABRT で即死する
# （ラッパーが ICU を LD_LIBRARY_PATH で渡すが macOS は無視するため）。
# .NET のグローバリゼーションを invariant にして ICU 依存を回避する。
[language-server.marksman]
command = "marksman"
args = ["server"]

[language-server.marksman.environment]
DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1"

[language-server.mpls]
command = "mpls"

# Liquid (Shopify)
[[language]]
name = "liquid"
scope = "source.liquid"
file-types = ["liquid"]
comment-token = "{%"
language-servers = ["shopify-theme-check"]

[language-server.shopify-theme-check]
command = "shopify"
args = ["theme", "language-server"]

# Liquid grammar (tree-sitter)
[[grammar]]
name = "liquid"
source = { git = "https://github.com/hankthetank27/tree-sitter-liquid", rev = "main" }
