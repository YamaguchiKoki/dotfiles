# Yazi メイン設定ファイル

# yazi 26.x で [manager] は [mgr] にリネームされた（旧名は無視される）
[mgr]
# 隠しファイルを表示
show_hidden = true
# シンボリックリンクを表示
show_symlink = true

[opener]
# デフォルトのエディタをhelixに設定
edit = [
  { run = 'hx "$@"', block = true, for = "unix" },
]

# テキストファイルの関連付け
# prepend_rules を使うことで yazi のデフォルトルール（末尾の catch-all フォールバック含む）を残しつつ、
# これらを優先的にマッチさせる。rules を直接書くとデフォルトが丸ごと消えるので注意。
[plugin]
# Markdown はプレビュー欄で glow レンダリング表示（piper 経由）
# yazi 26.x では previewer のマッチキーは `name` ではなく `url`
prepend_previewers = [
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
  { url = "*.markdown", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]

[open]
prepend_rules = [
  # 拡張子ベース（MIME 判定に依存しない。.ts が video/mp2t 誤判定されるのを回避）
  # yazi 26.x でマッチキーは name → url にリネームされた
  { url = "*.ts", use = "edit" },
  { url = "*.tsx", use = "edit" },
  { url = "*.js", use = "edit" },
  { url = "*.jsx", use = "edit" },
  { url = "*.mjs", use = "edit" },
  { url = "*.cjs", use = "edit" },
  { url = "*.vue", use = "edit" },
  { url = "*.svelte", use = "edit" },
  # MIME ベース
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/javascript", use = "edit" },
]
